name: Release

# Push a tag like v0.1.0 (matching package.json) to publish to npm.
# Publishing uses npm trusted publishing (OIDC): configure it on npmjs.com for this repository,
# workflow file "release.yml" and environment "npm". No long-lived npm token is needed;
# provenance is attached automatically (publishConfig.provenance is also set).
# Only the publish job can mint the OIDC token and only gh-release can write to the repository; neither installs
# dependencies, builds or runs tests: the build job does that without write permissions and hands over the tarball.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      # No dependency install scripts while building the release tarball (see ci.yml).
      - run: npm ci --ignore-scripts
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: node dist/tools/validate-scenarios.js scenarios
      - run: npm pack
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: package
          path: lurekit-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      id-token: write # npm trusted publishing and provenance
    env:
      # Secrets cannot be read in `if:`; this exposes only whether NPM_TOKEN is set, never its value.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      # ADR-0010 amendment (2026-11-05, block B15): no registry-fetched code runs in this job. Trusted publishing needs
      # npm 11.5.1 or newer; the npm bundled with the pinned setup-node release is used as is and its version asserted
      # numerically before any command that reaches the registry. On an older bundled npm the release fails here and
      # installs nothing: raise the node-version pin above instead of fetching npm from the live registry.
      - name: Bundled npm is at least 11.5.1 (trusted publishing minimum)
        run: |
          v="$(npm --version)"
          node -e '
          const min = [11, 5, 1];
          const v = process.argv[1].trim();
          const parts = v.split(".").map((x) => Number.parseInt(x, 10));
          if (parts.length < 3 || parts.some((n) => !Number.isInteger(n) || n < 0)) {
            console.error(`::error::cannot parse bundled npm version ${JSON.stringify(v)}`);
            process.exit(1);
          }
          for (let i = 0; i < 3; i += 1) {
            if (parts[i] > min[i]) break;
            if (parts[i] < min[i]) {
              console.error(`::error::bundled npm ${v} is older than 11.5.1: raise the node-version pin in release.yml`);
              process.exit(1);
            }
          }
          console.log(`ok: bundled npm ${v} >= 11.5.1`);
          ' "$v"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: package
      # The publish job has no checkout, so the version is read from package.json inside the downloaded tarball.
      # The build job already checks the tag against the source tree; checking again here guards the artifact
      # that is actually published: a tag vX.Y.Z must match exactly the version packed in the tarball.
      - name: Tag matches the packed package.json version
        id: version
        run: |
          version="$(tar -xOzf lurekit-*.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          if [[ "$GITHUB_REF" != "refs/tags/v$version" ]]; then
            echo "::error::Tag $GITHUB_REF does not match package.json version $version (expected refs/tags/v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Idempotency: a version can be published only once (the first release, lurekit@1.0.0, is published locally
      # with a token before the tag is pushed). Ask the registry whether this exact version already exists:
      # E404 means "not published yet"; any other npm failure stops the release rather than guessing.
      - name: Check whether the version is already on the registry
        id: registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if out="$(npm view "lurekit@$VERSION" version 2> view.err)"; then
            if [[ "$out" == "$VERSION" ]]; then
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              echo "::notice::lurekit@$VERSION already on the registry - publish skipped"
            else
              echo "already_published=false" >> "$GITHUB_OUTPUT"
            fi
          elif grep -q E404 view.err; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            cat view.err
            echo "::error::npm view lurekit@$VERSION failed for a reason other than 404"
            exit 1
          fi
      # Pre-release tags (v0.2.0-rc.1) go to the "next" dist-tag.
      # Trusted publishing (OIDC): no token in the environment, so npm cannot fall back to a long-lived one.
      # Skipped when the version is already on the registry, so re-running the tag does not fail with E403.
      - name: Publish to npm (trusted publishing)
        if: steps.registry.outputs.already_published == 'false' && env.HAS_NPM_TOKEN != 'true'
        run: npm publish ./lurekit-*.tgz $([[ "$GITHUB_REF_NAME" == *-* ]] && echo "--tag next")
      # Only for the very first publish (a trusted publisher can be configured only once the package exists):
      # a short-lived granular token in the NPM_TOKEN secret. Delete the secret right afterwards, so later
      # releases take the step above. Also skipped when the version is already on the registry.
      - name: Publish to npm (first release, NPM_TOKEN)
        if: steps.registry.outputs.already_published == 'false' && env.HAS_NPM_TOKEN == 'true'
        run: |
          echo "::warning::Publishing with the NPM_TOKEN secret. Configure the trusted publisher on npmjs.com and delete the secret."
          npm publish ./lurekit-*.tgz $([[ "$GITHUB_REF_NAME" == *-* ]] && echo "--tag next")
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Whichever step published, the registry must show a provenance attestation for this version; a publish
      # that silently lost provenance (publishConfig ignored, OIDC missing) fails the release before the GitHub
      # release is created. The registry can lag behind the publish, so retry for about a minute.
      # Runs only when this workflow published: a version published locally beforehand carries no provenance
      # by design, and this run must not fail because of it.
      - name: Published version carries npm provenance
        if: steps.registry.outputs.already_published == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          version="$VERSION"
          for attempt in $(seq 1 20); do
            if npm view "lurekit@$version" --json > view.json 2> view.err &&
               node -e "const d=require('./view.json'); const v=Array.isArray(d)?d[d.length-1]:d; process.exit(v?.dist?.attestations ? 0 : 1)"; then
              echo "lurekit@$version has provenance: $(node -p "JSON.stringify((d=>Array.isArray(d)?d[d.length-1]:d)(require('./view.json')).dist.attestations)")"
              exit 0
            fi
            echo "attempt $attempt: no dist.attestations for lurekit@$version yet"
            sleep 30
          done
          cat view.err
          echo "::error::lurekit@$version has no dist.attestations on the registry: it was published without provenance"
          exit 1

  gh-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub release
    steps:
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $([[ "$GITHUB_REF_NAME" == *-* ]] && echo "--prerelease")
        env:
          GH_TOKEN: ${{ github.token }}
