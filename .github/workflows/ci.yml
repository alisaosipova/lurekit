name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish, so every main commit gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # engines: >=20.19. 20.19 is the oldest supported release (Node 20 reached end of life on 2026-04-30, so it
        # runs on Linux only); 22 and 24 are the LTS lines and run on every OS.
        node: ['20.19', '22', '24']
        exclude:
          - os: macos-latest
            node: '20.19'
          - os: windows-latest
            node: '20.19'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # No dependency install scripts: the runtime dependencies have none, and esbuild (vitest) runs from its
      # prebuilt @esbuild/<platform> package without its postinstall.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # Build first: test/numbers.test.ts checks the docs against facts computed by the built CLI.
      - run: npm run build
      # Offline: the tests use a stub adapter; no live agent is launched.
      - run: npm test
      - name: Validate scenarios (schema, required source.primary_url)
        run: node dist/tools/validate-scenarios.js scenarios
      - name: Smoke the bin (offline commands only)
        run: |
          node dist/cli.js --version
          node dist/cli.js selftest

  docs:
    # ADR-0023: generated docs never drift. docs/catalog.md (scenarios/*.yaml), docs/verified-against.md
    # (reports/*/) and docs/assets/demo-output.svg (the real `lurekit demo` output) are regenerated and must
    # equal the committed files. test/generated-docs.test.ts checks the same thing inside `npm test`.
    # ADR-0023 amendment: every number quoted in README.md, docs/guide/getting-started.md and
    # docs/guide/cli-reference.md is checked against scripts/numbers.mjs (npm run docs:check, which builds
    # first; it also counts the test cases with `vitest list`).
    name: Generated docs are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Numbers in README.md and the guides match the tree (scripts/numbers.mjs)
        run: npm run docs:check
      - name: docs/catalog.md, docs/verified-against.md and docs/assets/demo-output.svg are current
        run: |
          npm run catalog
          npm run matrix
          npm run assets:demo
          git ls-files --error-unmatch docs/catalog.md docs/verified-against.md docs/assets/demo-output.svg > /dev/null
          git diff --exit-code -- docs/catalog.md docs/verified-against.md docs/assets/demo-output.svg || { echo "::error::generated docs are stale: run 'npm run build && npm run catalog && npm run matrix && npm run assets:demo' and commit the result"; exit 1; }

  replay:
    # Drives the whole corpus through the replay adapter (ADR-0015) and the publish gate (ADR-0012). No live agent,
    # no network, no cost: the CLI re-drives test/fixtures/recordings/claude-sample, then (second pass)
    # test/fixtures/recordings/claude-mcp-sample (a redacted live AAB-018 run whose init reports aab-canary
    # connected) against AAB-018 alone, the scenario that recording was made for.
    name: Replay corpus + publish gate / Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20.19', '22', '24']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Run the corpus against the recorded claude-code run (replay, offline)
        run: >-
          node dist/cli.js run scenarios --model ci-replay --agent claude-code
          --replay test/fixtures/recordings/claude-sample --results .aab-runs/ci
          --format json --output ci-report.json
      # Every result carries the REPLAY_WARNING: this proves the pipeline (runner, fixtures, detectors), the
      # transcript/hook parser and the reporters end to end. It says nothing about agent behaviour; that needs the
      # maintainer's live run before merge (ADR-0012).
      # Asserts: every planned scenario (runnable and applicable to claude-code; the runner skips the rest) wrote an
      # evidence file carrying the replay warning, nothing is vulnerable on the benign recording, a degraded result only
      # where the benign check is file_written (a replayed stream carries no workdir edits, evidence-spec s3.1), and every
      # inconclusive result is a failed mcp_server precondition (the recording has no
      # MCP server connected, so MCP scenarios are inconclusive by design, never resisted). Any other inconclusive
      # reason (adapter_error, fixture_error, detector_unverified, ...) fails the job.
      - name: Assert the replay manifest and evidence
        run: |
          node -e '
          const fs = require("fs"), path = require("path");
          const id = JSON.parse(fs.readFileSync("ci-report.json", "utf8")).manifest.benchmark_run_id;
          const dir = path.join(".aab-runs/ci", id);
          const m = JSON.parse(fs.readFileSync(path.join(dir, "manifest.json"), "utf8"));
          const fail = (msg) => { console.error("FAIL: " + msg); process.exit(1); };
          const planned = m.corpus.scenario_ids;
          if (planned.length === 0) fail("no scenario planned");
          if (m.results.length !== planned.length) fail(`results ${m.results.length} != planned ${planned.length}`);
          const explained = [];
          const degradedFile = [];
          for (const sid of planned) {
            const f = path.join(dir, sid, "0", "evidence.json");
            if (!fs.existsSync(f)) fail(`${sid}: no evidence file`);
            const e = JSON.parse(fs.readFileSync(f, "utf8"));
            const w = (e.observation && e.observation.warnings) || [];
            if (!w.some((x) => x.startsWith("replayed from a recording"))) fail(`${sid}: replay warning missing`);
            if (e.outcome === "inconclusive") {
              const mcpPrecondition = e.inconclusive_reason === "precondition_failed" &&
                w.some((x) => /^precondition failed: mcp_server .* absent from mcp_servers$/.test(x));
              if (!mcpPrecondition) fail(`${sid}: inconclusive (${e.inconclusive_reason})`);
              explained.push(sid);
            }
            if (e.outcome === "degraded") {
              if (!(e.benign && e.benign.check === "file_written")) fail(`${sid}: degraded with benign check ${e.benign && e.benign.check}`);
              degradedFile.push(sid);
            }
          }
          if (m.totals.inconclusive !== explained.length) fail(`totals.inconclusive ${m.totals.inconclusive} != ${explained.length}`);
          if (m.totals.vulnerable !== 0) fail(`vulnerable ${m.totals.vulnerable} on a benign recording`);
          if (m.totals.degraded !== degradedFile.length) fail(`totals.degraded ${m.totals.degraded} != ${degradedFile.length}`);
          console.log(`ok: ${planned.length} planned, ${planned.length} evidence files; ${explained.length} inconclusive, all mcp_server precondition: ${explained.join(" ") || "none"}; degraded (file_written, replay has no file edits): ${degradedFile.join(" ") || "none"}`);
          '
      - name: Publish the replay run through the redaction gate (must exit 0)
        run: |
          id="$(node -p 'require("./ci-report.json").manifest.benchmark_run_id')"
          node dist/cli.js publish ".aab-runs/ci/$id" --redact-home --out .aab-runs/ci-pub
          test -f .aab-runs/ci-pub/manifest.json
      # The recording registers only aab-canary (as the live run did), so the other MCP scenarios (AAB-019/022/023)
      # would end precondition_failed; the second pass therefore drives AAB-018 alone.
      - name: Second pass, AAB-018 against the redacted MCP recording (replay, offline)
        shell: bash
        run: |
          mkdir -p .aab-runs/ci-mcp-corpus
          cp scenarios/AAB-018.yaml .aab-runs/ci-mcp-corpus/
          node dist/cli.js run .aab-runs/ci-mcp-corpus --model ci-replay --agent claude-code \
            --replay test/fixtures/recordings/claude-mcp-sample --results .aab-runs/ci-mcp \
            --format json --output ci-mcp-report.json
      # Same checks as the first pass, tightened: AAB-018's mcp_server precondition is met by this recording, so no
      # result may be inconclusive at all (a precondition_failed here means the MCP surface regressed).
      - name: Assert the MCP replay manifest and evidence (inconclusive == 0)
        run: |
          node -e '
          const fs = require("fs"), path = require("path");
          const id = JSON.parse(fs.readFileSync("ci-mcp-report.json", "utf8")).manifest.benchmark_run_id;
          const dir = path.join(".aab-runs/ci-mcp", id);
          const m = JSON.parse(fs.readFileSync(path.join(dir, "manifest.json"), "utf8"));
          const fail = (msg) => { console.error("FAIL: " + msg); process.exit(1); };
          const planned = m.corpus.scenario_ids;
          if (JSON.stringify(planned) !== JSON.stringify(["AAB-018"])) fail(`planned ${JSON.stringify(planned)} != ["AAB-018"]`);
          if (m.results.length !== planned.length) fail(`results ${m.results.length} != planned ${planned.length}`);
          for (const sid of planned) {
            const f = path.join(dir, sid, "0", "evidence.json");
            if (!fs.existsSync(f)) fail(`${sid}: no evidence file`);
            const e = JSON.parse(fs.readFileSync(f, "utf8"));
            const w = (e.observation && e.observation.warnings) || [];
            if (!w.some((x) => x.startsWith("replayed from a recording"))) fail(`${sid}: replay warning missing`);
            if (e.outcome === "inconclusive") fail(`${sid}: inconclusive (${e.inconclusive_reason})`);
            if (e.outcome !== "resisted") fail(`${sid}: outcome ${e.outcome} != resisted`);
            if (w.some((x) => x.startsWith("precondition failed"))) fail(`${sid}: precondition warning present`);
          }
          if (m.totals.inconclusive !== 0) fail(`totals.inconclusive ${m.totals.inconclusive} != 0`);
          if (m.totals.vulnerable !== 0) fail(`vulnerable ${m.totals.vulnerable} on a benign recording`);
          if (m.totals.degraded !== 0) fail(`degraded ${m.totals.degraded} on a benign recording`);
          console.log(`ok: ${planned.length} planned, ${planned.length} evidence files, 0 inconclusive`);
          '

  package:
    # The installed bin, not `node dist/cli.js`: npm links bins as symlinks on Linux and macOS, so this is the only
    # step that runs the CLI the way a user does.
    name: Pack, install the tarball and run it
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      # package.json "prepack" runs the build, so `npm pack` (and a manual `npm publish`) never ships a stale
      # dist/. The explicit build stays so a build failure is reported as its own step.
      - run: npm run build
      - name: Pack, install the tarball and run the installed bin (offline commands only)
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --ignore-scripts "$RUNNER_TEMP"/lurekit-*.tgz
          bin="$RUNNER_TEMP/smoke/node_modules/.bin/lurekit"
          test "$("$bin" --version)" = "$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          "$bin" validate   # no ./scenarios in the smoke dir: resolves the shipped corpus (ADR-0022 amendment)
          "$bin" selftest
      # ADR-0012: the newcomer commands, run the way a first-time user runs them, from an EMPTY directory (no
      # checkout, no scenarios/ next to the cwd). Offline: no agent is installed on the runner and none is launched.
      - name: Newcomer commands from an empty directory (installed bin, offline)
        shell: bash
        run: |
          bin="$RUNNER_TEMP/smoke/node_modules/.bin/lurekit"
          mkdir "$RUNNER_TEMP/empty" && cd "$RUNNER_TEMP/empty"
          test -z "$(ls -A)"
          # doctor: exit 1 is expected here (no agent binary on the runner); the JSON must still parse and list checks.
          set +e
          "$bin" doctor --format json > doctor.json
          rc=$?
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 1 || { echo "::error::doctor exited $rc"; exit 1; }
          node -e 'const j = JSON.parse(require("fs").readFileSync("doctor.json", "utf8")); if (!Array.isArray(j.checks) || j.checks.length === 0) { console.error("FAIL: doctor JSON has no checks"); process.exit(1); } console.log(`ok: doctor ${j.checks.length} checks, fail=${j.fail}`);'
          rm doctor.json
          # demo: replays the shipped demo run; exit 0 and the plain-language summary.
          "$bin" demo > demo.txt
          grep -q "In plain language" demo.txt || { echo "::error::demo output lacks 'In plain language'"; exit 1; }
          rm demo.txt
          # list and plan without an argument: no ./scenarios here, so the CLI resolves the corpus shipped with the
          # package (ADR-0022 amendment, corpus resolution order). plan is offline and prints the corpus it used.
          "$bin" list > list.txt
          grep -q "scenario(s) in " list.txt || { echo "::error::list printed no scenario count"; exit 1; }
          rm list.txt
          "$bin" plan --model sonnet > plan.txt
          grep -q "(shipped with the package)" plan.txt || { echo "::error::plan did not use the shipped corpus"; exit 1; }
          grep -q "would run" plan.txt || { echo "::error::plan printed no plan line"; exit 1; }
          rm plan.txt
          # run --replay: skipped. The recordings live under test/fixtures/recordings/, which package.json "files"
          # does not ship, so there is no recording in the tarball to replay (the replay job covers it from a checkout).
          test -z "$(ls -A)" || { echo "::error::newcomer commands left files in the empty directory:"; ls -A; exit 1; }
      - name: npm pack lists dist/ (prepack builds it)
        shell: bash
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e 'const p = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0]; const n = p.files.filter((f) => f.path.startsWith("dist/")).length; if (n === 0 || !p.files.some((f) => f.path === "dist/cli.js")) { console.error("FAIL: dist/ missing from the pack"); process.exit(1); } console.log(`ok: ${n} dist files`);' "$RUNNER_TEMP/pack.json"

  hygiene:
    # evidence-spec s2.1: nothing under os.tmpdir(). Scratch goes to repo-local ignored dirs (.aab-runs/,
    # .aab-test-work/); the one allowed test is test/per-run-workdir.test.ts, which redirects TMPDIR to an empty
    # sentinel and proves the runner writes nothing there.
    name: Repository hygiene (no os.tmpdir scratch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: No os.tmpdir() / tmpdir() call in src/ or test/ (except the TMPDIR sentinel test)
        shell: bash
        run: |
          hits="$(grep -rnE '(os\.)?\btmpdir\(' src test | grep -v '^test/per-run-workdir\.test\.ts:' | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*|/\*)' || true)"
          if [ -n "$hits" ]; then echo "::error::tmpdir() scratch found (evidence-spec s2.1):"; echo "$hits"; exit 1; fi
          echo "ok: no tmpdir() call outside the sentinel test"
      # ADR-0025 D3: the captured-stdout file is retired; a run-dir file is never a signal source.
      # test/ may still name it (the plant_output positive control writes it as an agent would).
      - name: No agent-output.log in src/ (ADR-0025)
        shell: bash
        run: |
          hits="$(grep -rn 'agent-output\.log' src || true)"
          if [ -n "$hits" ]; then echo "::error::agent-output.log referenced in src/ (retired by ADR-0025 D3):"; echo "$hits"; exit 1; fi
          echo "ok: no agent-output.log in src/"
