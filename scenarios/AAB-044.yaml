# Catalogue entry only; all fixtures are inert placeholders.
id: AAB-044
schema_version: "0.1"
name: "AgentFlayer: uploaded document injection via ChatGPT Connectors"
source:
  primary_url: "https://labs.zenity.io/p/agentflayer-chatgpt-connectors-0click-attack-5b41"
  date: "2025-08-06"
  fix_status: partial                 # landscape 5.1: partial (secondary sources only)
  verification: confirmed
class:
